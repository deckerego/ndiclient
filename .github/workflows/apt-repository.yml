name: APT repository

# Publishing a GitHub release (tagged X.Y.Z, without a "v") builds the package
# for each supported Debian release and adds each build to that release's
# distribution in the APT repository on the gh-pages branch, which GitHub
# Pages serves. The tag is the version: it is stamped into Cargo.toml,
# Cargo.lock and the Debian changelog (with the release notes as its entry)
# before building, and committed to main once the repository is published.
# Draft releases don't run it until they are published.
on:
  release:
    types: [published]
  workflow_dispatch: 

# Publishing commits to gh-pages; two runs at once would race on the push.
concurrency:
  group: apt-repository
  cancel-in-progress: false

# Actions are pinned to commit SHAs and the images to digests, so a moved tag
# can't change what runs. The comments name the version each pin was taken from.
jobs:
  # Looks the release up by its tag rather than reading the event, so a manual
  # run on a release tag gets the same notes and date as the original run.
  release:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.release.outputs.notes }}
      published-at: ${{ steps.release.outputs.published-at }}
    steps:
      - name: Read the release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_at="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          notes="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "published-at=$published_at"
            echo "notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  # Runs third-party code (the NDI installer, crate build scripts) as root,
  # so it gets no secrets and only a read-only token.
  build:
    needs: release
    runs-on: ubuntu-24.04-arm
    # Built on each Debian release Raspberry Pi OS is based on (the current
    # one and the one before), so dpkg-shlibdeps derives dependencies that
    # exist there. Publishing waits for all of them.
    strategy:
      matrix:
        include:
          - distribution: trixie
            image: &trixie debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
          - distribution: bookworm
            image: debian:bookworm@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
    container: ${{ matrix.image }}
    permissions:
      contents: read
    env:
      NDI_SDK_URL: https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz
      # SDK v6.3.2. NDI replaces the download in place, so a new SDK release
      # fails the check: review it, update the checksum and the bindings.
      NDI_SDK_SHA256: f0314f245446defc488b63ceb4689acf1a965aeefdadacb70571bb216a8cc183
      NDI_SDK_DIR: /opt/ndi/NDI SDK for Linux
      ARTIFACT_PREFIX: &artifact_prefix debian-package-
    steps:
      # libndi links against Avahi's client libraries (NDI's mDNS discovery).
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libsdl2-dev \
            libavahi-client3 dpkg-dev

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Fails unless the tag is X.Y.Z and not older than the changelog.
      - name: Stamp the release version
        env:
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
          RELEASE_DATE: ${{ needs.release.outputs.published-at }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" \
            | packaging/stamp_release.sh "$GITHUB_REF_NAME" "$RELEASE_DATE"

      # The installer shows the NDI SDK license and asks for agreement. The
      # repository owner has accepted it; piping "y" records that acceptance
      # for this build. Its output (license text, file list) is discarded.
      - name: Install the NDI SDK
        run: |
          install -d "$(dirname "$NDI_SDK_DIR")"
          cd "$(dirname "$NDI_SDK_DIR")"
          curl -fsSL -o ndi-sdk.tar.gz "$NDI_SDK_URL"
          echo "$NDI_SDK_SHA256  ndi-sdk.tar.gz" | sha256sum --check --strict
          tar xzf ndi-sdk.tar.gz
          echo y | PAGER=cat sh Install_NDI_SDK_v6_Linux.sh > /dev/null
          cat "$NDI_SDK_DIR/Version.txt"

      - name: Build the package
        run: packaging/build_deb.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}${{ matrix.distribution }}
          path: target/debian/*.deb

  # Signs and publishes in a fresh container that runs only this repository's
  # scripts and Debian's tools, so no build code shares a filesystem with the
  # signing key. The publishing environment admits only release tags.
  publish:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: *trixie
    environment: publishing
    permissions:
      contents: write
    env:
      PACKAGE_DIR: packages
      ARTIFACT_PREFIX: *artifact_prefix
      APT_REPO_DIR: apt-repo
      APT_REPO_URL: https://deckerego.github.io/ndiclient
      PAGES_BRANCH: gh-pages
    steps:
      - name: Install publishing tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git apt-utils gnupg gpgv

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each artifact lands in its own directory, named after the artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}*
          path: ${{ env.PACKAGE_DIR }}

      - name: Check out the APT repository
        run: |
          # The container runs as root on a workspace the runner user owns.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/$APT_REPO_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$PAGES_BRANCH"; then
            git fetch --depth 1 origin "$PAGES_BRANCH"
            git worktree add "$APT_REPO_DIR" FETCH_HEAD -B "$PAGES_BRANCH"
          else
            git worktree add --orphan -b "$PAGES_BRANCH" "$APT_REPO_DIR"
          fi

      - name: Import the signing key
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          echo "$SIGNING_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "APT_SIGNING_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Update the APT repository
        run: |
          for artifact_dir in "$PACKAGE_DIR/$ARTIFACT_PREFIX"*; do
            distribution="${artifact_dir#"$PACKAGE_DIR/$ARTIFACT_PREFIX"}"
            packaging/update_apt_repo.sh "$APT_REPO_DIR" "$distribution" "$artifact_dir"/*.deb
          done

      # Verifying against the published public key catches a secret and a
      # variable that belong to different key pairs before users see it.
      - name: Verify the signature with the public key
        env:
          SIGNING_PUBLIC_KEY: ${{ vars.SIGNING_PUBLIC_KEY }}
        run: |
          echo "$SIGNING_PUBLIC_KEY" | gpg --dearmor > "$RUNNER_TEMP/public-key.gpg"
          for release in "$APT_REPO_DIR"/dists/*/InRelease; do
            gpgv --keyring "$RUNNER_TEMP/public-key.gpg" "$release"
          done

      # Users trust the key inline in the .sources file, so it must verify
      # its own distribution's signature too.
      - name: Verify the signature with each sources file's key
        run: |
          for sources in "$APT_REPO_DIR"/*.sources; do
            distribution="$(basename "$sources" .sources)"
            sed -n '/^Signed-By:/,$ s/^ //p' "$sources" | sed 's/^\.$//' \
              | gpg --dearmor > "$RUNNER_TEMP/$distribution-key.gpg"
            gpgv --keyring "$RUNNER_TEMP/$distribution-key.gpg" \
              "$APT_REPO_DIR/dists/$distribution/InRelease"
          done

      # .nojekyll makes Pages serve the files as they are.
      - name: Publish the APT repository
        run: |
          cd "$APT_REPO_DIR"
          touch .nojekyll
          git add --all
          git commit -m "Publish ndiclient from ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push origin "$PAGES_BRANCH"

  # Stamps main the same way the build stamped the tag, so main carries the
  # released version. Nothing from the build reaches it, and it needs no
  # secrets. It commits nothing if main already has the version.
  commit:
    needs: [release, publish]
    runs-on: ubuntu-24.04-arm
    container: *trixie
    permissions:
      contents: write
    env:
      MAIN_BRANCH: main
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git dpkg-dev

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.MAIN_BRANCH }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Stamp the release version
        env:
          RELEASE_NOTES: ${{ needs.release.outputs.notes }}
          RELEASE_DATE: ${{ needs.release.outputs.published-at }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" \
            | packaging/stamp_release.sh "$GITHUB_REF_NAME" "$RELEASE_DATE"

      - name: Commit the release version to main
        run: |
          # The container runs as root on a workspace the runner user owns.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/debian/changelog
          if git diff --cached --quiet; then
            echo "$MAIN_BRANCH already has release $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "Release ${GITHUB_REF_NAME}"
          git push origin "HEAD:$MAIN_BRANCH"
